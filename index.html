<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qwen // local chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="title">local<span>://</span>chat</div>
  <div class="controls">
    <input id="host" type="text" value="http://localhost:11434" size="24" title="Ollama host">
    <select id="model">
      <option value="qwen2.5-coder">qwen2.5-coder</option>
      <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
      <option value="qwen2.5-coder:14b">qwen2.5-coder:14b</option>
      <option value="qwen2.5-coder:32b">qwen2.5-coder:32b</option>
    </select>
    <span id="status">checking…</span>
  </div>
</header>

<div id="log">
  <div class="empty" id="emptyState">Ask it something. Runs entirely on your machine via Ollama.</div>
</div>

<form id="form">
  <textarea id="input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const hostEl = document.getElementById('host');
const modelEl = document.getElementById('model');
const emptyState = document.getElementById('emptyState');

let history = [];

function addMessage(role, text){
  if(emptyState) emptyState.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const roleLabel = document.createElement('div');
  roleLabel.className = 'role ' + (role === 'user' ? 'you' : 'model');
  roleLabel.textContent = role === 'user' ? 'you' : modelEl.value;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(roleLabel);
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

async function checkStatus(){
  try{
    const res = await fetch(hostEl.value.replace(/\/$/, '') + '/api/tags');
    if(!res.ok) throw new Error();
    const data = await res.json();
    statusEl.textContent = 'connected · ' + (data.models ? data.models.length : 0) + ' models';
    statusEl.className = 'ok';
  }catch(e){
    statusEl.textContent = "can't reach Ollama — is it running?";
    statusEl.className = 'err';
  }
}
checkStatus();
hostEl.addEventListener('change', checkStatus);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  history.push({ role: 'user', content: text });
  sendBtn.disabled = true;

  const replyBubble = addMessage('assistant', '');
  let full = '';

  try{
    const res = await fetch(hostEl.value.replace(/\/$/, '') + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modelEl.value,
        messages: history,
        stream: true
      })
    });

    if(!res.ok || !res.body) throw new Error('request failed');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.trim()) continue;
        try{
          const json = JSON.parse(line);
          if(json.message && json.message.content){
            full += json.message.content;
            replyBubble.textContent = full;
            log.scrollTop = log.scrollHeight;
          }
        }catch(err){ /* ignore partial line */ }
      }
    }
    history.push({ role: 'assistant', content: full });
  }catch(err){
    replyBubble.textContent = 'Error talking to Ollama: ' + err.message;
  }finally{
    sendBtn.disabled = false;
    checkStatus();
  }
});

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});
</script>
</body>
</html>
